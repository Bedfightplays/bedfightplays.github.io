<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eaglercraft Launcher</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --panel: #181818;
      --border: #2a2a2a;
      --text: #e4e4e4;
      --muted: #888;
      --accent: #4CAF50;
      --accent-hover: #43a047;
      --danger: #e53935;
      --selected: #262626;
      --hover: #1f1f1f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100%;
    }

    /* Main Content */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      overflow-y: auto;
      transition: margin-right 0.3s ease;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .info-block {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .info-title {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .info-text {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .controls {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }

    .controls input {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #222;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .controls input:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: #333;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #3a3a3a;
    }

    .btn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    #status {
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.2rem;
      margin-bottom: 1rem;
    }

    #game-container {
      flex: 1;
      background: #0a0a0a;
      border: 2px dashed var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 0.95rem;
      overflow: hidden;
      position: relative;
    }

    #game-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, width 0.3s ease;
      position: relative;
    }

    .sidebar.hidden {
      transform: translateX(100%);
      width: 0;
      border: none;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .toggle-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .toggle-btn:hover {
      background: #2a2a2a;
      color: var(--text);
    }

    .client-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .client-item {
      padding: 0.8rem;
      margin-bottom: 0.5rem;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
